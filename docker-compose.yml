name: starpanel_docker

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/starlink_fleet.db
      SESSION_DIR: /data
    volumes:
      - starpanel_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs/deployment/nginx-starpanel-limits.conf:/etc/nginx/conf.d/limits.conf:ro
    depends_on:
      - backend
      - frontend
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

  portainer:
    profiles:
      - portainer
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  starpanel_data:
  caddy_data:
  caddy_config:
  portainer_data:
