# StarPanel — nginx (variante Docker).  Montar en:  /etc/nginx/conf.d/default.conf
#
# Variante deliberada de docs/deployment/nginx-starpanel.conf (la del host, con
# TLS propio y certbot): aquí el TLS lo termina Caddy, el único contenedor
# publicado. Diferencias, y ninguna más: un solo server en 80 sin certificados,
# server_name _, y proxy_pass a backend:8000 / frontend:3000 en vez de
# 127.0.0.1. No unificar los dos ficheros sin cambiar también el despliegue.
#
# Dos capas de puerta:
#   1) El panel entero pasa por `auth_request` → /api/v1/panel/verify (cookie de sesión).
#   2) La extensión sube la cookie por /api/auth/login, validada con X-Ingest-Token.

server {
    listen 80;
    server_name _;

    # nginx no está publicado: el único que puede hablarle es Caddy, así que
    # fiarse de su X-Forwarded-For es seguro. Sin esto, todos los clientes
    # compartirían un cubo de limit_req y uno bloquearía el login a los demás.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # (Sin TLS aquí: lo termina Caddy. Ver deploy/docker/Caddyfile.)

    # --- Cabeceras de seguridad ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Next.js inyecta scripts/estilos inline, así que 'unsafe-inline' es necesario;
    # aun así object-src/base-uri/form-action cierran la exfiltración por inyección.
    # El panel no carga nada externo (verificado: sin CDN, fuentes self-hosted).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 1m;

    # --- Subpetición de autorización: ¿hay cookie de panel válida? ---
    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/v1/panel/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Endpoints SIN sesión de panel ---

    # Login del panel (contraseña de OG). Rate-limit estricto.
    location = /api/panel/session {
        limit_req zone=sp_login burst=3 nodelay;
        proxy_pass http://backend:8000/api/v1/panel/session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Ingesta de la cookie de Starlink por la extensión (X-Ingest-Token).
    location = /api/auth/login {
        limit_req zone=sp_login burst=5 nodelay;
        proxy_pass http://backend:8000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Página de login y assets (deben cargar sin sesión).
    location /login {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /_next/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }

    # --- API protegida por sesión + anti-CSRF ---
    location /api/ {
        auth_request /_auth;

        # Los métodos que cambian estado exigen la cabecera del panel.
        set $csrf 0;
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { set $csrf 1; }
        if ($http_x_requested_with = "starpanel") { set $csrf 0; }
        if ($csrf = 1) { return 403; }

        limit_req zone=sp_api burst=60 nodelay;
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;   # el sync consulta ~57 cuentas
        proxy_send_timeout 900s;
    }

    # Bloquear la ruta interna de imágenes de Next.js: puede ser abusada como proxy
    # de subpeticiones no autenticadas al backend (riesgo medio/alto detectado).
    location = /_next/image {
        deny all;
        return 403;
    }

    # --- Todo lo demás: el panel, si hay sesión ---
    location / {
        auth_request /_auth;
        error_page 401 =302 /login;
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        # Sin WebSocket upgrade: el panel en produccion no usa websockets, y
        # anunciarlos al backend abria el SSRF de Next 14 por upgrade.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Nunca servir ficheros sensibles.
    location ~ /\.(env|key|enc|db|sqlite|log|git) {
        deny all;
        return 404;
    }
}
