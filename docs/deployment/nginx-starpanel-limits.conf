# Zonas de rate-limit: van en el contexto `http`, por eso van en su propio fichero.
# Instalar en:  /etc/nginx/conf.d/starpanel-limits.conf

# Login (panel y extensión): 10 intentos por minuto y por IP.
limit_req_zone $binary_remote_addr zone=sp_login:10m rate=10r/m;
# API general: 120 peticiones por minuto y por IP.
limit_req_zone $binary_remote_addr zone=sp_api:10m rate=120r/m;
