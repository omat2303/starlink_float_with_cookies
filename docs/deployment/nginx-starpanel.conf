# StarPanel — nginx.  Instalar en:  /etc/nginx/sites-available/starpanel
# Antes: reemplaza panel.ejemplo.org si cambia el dominio y corre certbot.
#
# Dos capas de puerta:
#   1) El panel entero pasa por `auth_request` → /api/v1/panel/verify (cookie de sesión).
#   2) La extensión sube la cookie por /api/auth/login, validada con X-Ingest-Token.

server {
    listen 80;
    server_name panel.ejemplo.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name panel.ejemplo.org;

    # --- TLS (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/panel.ejemplo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.ejemplo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Cabeceras de seguridad ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 1m;

    # --- Subpetición de autorización: ¿hay cookie de panel válida? ---
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/v1/panel/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Endpoints SIN sesión de panel ---

    # Login del panel (contraseña de OG). Rate-limit estricto.
    location = /api/panel/session {
        limit_req zone=sp_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000/api/v1/panel/session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ingesta de la cookie de Starlink por la extensión (X-Ingest-Token).
    location = /api/auth/login {
        limit_req zone=sp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Página de login y assets (deben cargar sin sesión).
    location /login {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # --- API protegida por sesión + anti-CSRF ---
    location /api/ {
        auth_request /_auth;

        # Los métodos que cambian estado exigen la cabecera del panel.
        set $csrf 0;
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { set $csrf 1; }
        if ($http_x_requested_with = "starpanel") { set $csrf 0; }
        if ($csrf = 1) { return 403; }

        limit_req zone=sp_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;   # el sync consulta ~57 cuentas
        proxy_send_timeout 900s;
    }

    # Bloquear la ruta interna de imágenes de Next.js: puede ser abusada como proxy
    # de subpeticiones no autenticadas al backend (riesgo medio/alto detectado).
    location = /_next/image {
        deny all;
        return 403;
    }

    # --- Todo lo demás: el panel, si hay sesión ---
    location / {
        auth_request /_auth;
        error_page 401 =302 /login;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nunca servir ficheros sensibles.
    location ~ /\.(env|key|enc|db|log|git) {
        deny all;
        return 404;
    }
}
